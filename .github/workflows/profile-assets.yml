name: profile assets

# Regenerates the two dynamic SVGs the README points at.
# Run it manually once (Actions → profile assets → Run workflow) before
# you trust the cron, otherwise the images 404 until 18:30 UTC.

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── snake ────────────────────────────────────────────────────
  # Output lands on a separate `output` branch so it never pollutes
  # your commit history on main.
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c5cff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3D contribution calendar & live telemetry ────────────────
  # This one commits into main, under profile-3d-contrib/ and assets/.
  calendar-and-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Live Retro Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_telemetry.py

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: commit updated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/signals*.svg
          git diff --staged --quiet || git commit -m "chore: refresh 3d calendar & telemetry SVGs"
          git push
