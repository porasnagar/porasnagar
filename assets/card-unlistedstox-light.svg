<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170" width="580" height="170" role="img" aria-label="UnlistedStox Console">
  <defs>
    <clipPath id="c1"><rect width="580" height="170" rx="10"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .beat { animation: b 2.2s infinite ease-in-out; }
    @keyframes b { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <g clip-path="url(#c1)">
    <rect width="580" height="170" fill="#ffffff"/>
    <rect width="580" height="36" fill="#eaeff5"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#e3e8ef" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#28c840"/>
    <text class="mono" x="66" y="22" font-size="11" fill="#64748b">engine: otc_valuation_pipeline.py</text>
    <circle cx="504" cy="18" r="3.5" fill="#16a34a" class="beat"/>
    <text class="mono" text-anchor="end" x="562" y="22" font-size="10.5" fill="#16a34a">PROD LIVE</text>

    <!-- Simulated Depth & Valuation Metrics -->
    <g transform="translate(18, 48)">
      <rect width="260" height="106" rx="6" fill="#f8fafc" stroke="#e3e8ef" stroke-width="1"/>
      <text class="mono" x="12" y="20" font-size="10" fill="#64748b">OTC ORDER BOOK DEPTH</text>
      <!-- Depth bars -->
      <rect x="12" y="32" width="160" height="8" rx="2" fill="#0891b2" opacity="0.85"/>
      <rect x="12" y="46" width="210" height="8" rx="2" fill="#0891b2" opacity="0.65"/>
      <rect x="12" y="60" width="130" height="8" rx="2" fill="#0891b2" opacity="0.45"/>
      <rect x="12" y="74" width="180" height="8" rx="2" fill="#0891b2" opacity="0.30"/>
      <text class="mono" x="12" y="98" font-size="10" fill="#0891b2">TF Regression • Auto-Rebalance</text>
    </g>

    <g transform="translate(294, 48)">
      <rect width="268" height="106" rx="6" fill="#f8fafc" stroke="#e3e8ef" stroke-width="1"/>
      <text class="mono" x="14" y="20" font-size="10" fill="#64748b">B-TREE TIME-SERIES READS</text>
      <text class="mono" x="14" y="52" font-size="24" font-weight="700" fill="#1f2937">12.4 <tspan font-size="14" fill="#0891b2">ms</tspan></text>
      <text class="mono" x="14" y="76" font-size="10.5" fill="#64748b">Postgres B-tree partition</text>
      <text class="mono" x="14" y="94" font-size="10" fill="#16a34a">● 0 dropped queries</text>
    </g>
    <rect width="580" height="170" rx="10" fill="none" stroke="#e3e8ef" stroke-width="1"/>
  </g>
</svg>