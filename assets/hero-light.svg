<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Poras Nagar — AI Engineer, Distributed Systems, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============================================================
       LIGHT TWIN of hero.svg. Same geometry, retuned tokens.
       If you edit text in hero.svg, mirror it here (look for ✎).
       canvas #ffffff | panel #f6f8fa | hairline #e3e8ef
       violet #6d28d9 | cyan #0891b2 | amber #b45309
       ============================================================ -->

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="0.26" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="0.80" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9">
        <animate attributeName="stop-color" values="#6d28d9;#0891b2;#b45309;#6d28d9" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#0891b2">
        <animate attributeName="stop-color" values="#0891b2;#b45309;#6d28d9;#0891b2" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309;#6d28d9;#0891b2;#b45309" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1f2937" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1f2937" stop-opacity="0.035"/>
      <stop offset="1"   stop-color="#1f2937" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#6d28d9"/>
      <stop offset="0.6" stop-color="#0891b2"/>
      <stop offset="1"   stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#e3e8ef" stroke-width="1"/>
    </pattern>

    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>

    <clipPath id="typeClip">
      <rect x="64" y="204" width="622" height="36">
        <animate attributeName="width" values="0;0;622" keyTimes="0;0.16;0.92" dur="4.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <path id="e1" d="M0 0 L-120 -72"/>
    <path id="e2" d="M0 0 L4 -104"/>
    <path id="e3" d="M0 0 L112 -34"/>
    <path id="e4" d="M0 0 L44 74"/>
    <path id="e5" d="M0 0 L-94 58"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .drift { animation: drift 26s linear infinite; }
    @keyframes drift { to { transform: translate(-44px, -44px); } }
    .sweep { animation: sweep 9s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px); } 60%,100% { transform: translateX(1300px); } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    .beat  { animation: beat 2.6s ease-in-out infinite; }
    @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    .in    { animation: in .85s cubic-bezier(.22,1,.36,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .d1 { animation-delay: .10s } .d4 { animation-delay: .52s } .d6 { animation-delay: .80s }
    @media (prefers-reduced-motion: reduce) {
      .drift, .sweep, .caret, .beat, .in { animation: none; }
      .in { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#canvas)"/>
    <g class="drift"><rect x="-44" y="-44" width="1300" height="440" fill="url(#grid)"/></g>
    <rect width="1200" height="340" fill="url(#bloomA)"/>
    <rect width="1200" height="340" fill="url(#bloomB)"/>
    <g class="sweep"><rect width="300" height="340" fill="url(#sheen)"/></g>

    <rect width="1200" height="52" fill="#eef1f6" opacity="0.9"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#dde3ea" stroke-width="1"/>
    <circle cx="34" cy="26" r="5" fill="#ff5f57"/>
    <circle cx="54" cy="26" r="5" fill="#febc2e"/>
    <circle cx="74" cy="26" r="5" fill="#28c840"/>
    <text class="mono" x="100" y="31" font-size="12.5" fill="#6b7686" letter-spacing="0.06em">porasnagar / README.md</text>
    <circle cx="972" cy="26" r="4" fill="#1a7f37" class="beat"/>
    <text class="mono" text-anchor="end" x="1166" y="31" font-size="12.5" fill="#6b7686" letter-spacing="0.06em">open to AI / backend roles</text>

    <g transform="translate(958,178)" class="in d6">
      <g stroke="#cfd8e3" stroke-width="1.2" fill="none">
        <path d="M0 0 L-120 -72"/><path d="M0 0 L4 -104"/><path d="M0 0 L112 -34"/>
        <path d="M0 0 L44 74"/><path d="M0 0 L-94 58"/>
        <path d="M-120 -72 L4 -104" stroke-dasharray="3 5"/>
        <path d="M112 -34 L44 74"  stroke-dasharray="3 5"/>
        <path d="M-94 58 L44 74"   stroke-dasharray="3 5"/>
      </g>
      <circle r="2.8" fill="#0891b2"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="2.8" fill="#6d28d9"><animateMotion dur="2.9s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="2.8" fill="#b45309"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="2.8" fill="#0891b2"><animateMotion dur="3.1s" begin="1.3s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="2.8" fill="#6d28d9"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <g fill="#ffffff" stroke="#b6c1d0" stroke-width="1.4">
        <circle cx="-120" cy="-72" r="7"/><circle cx="4" cy="-104" r="7"/>
        <circle cx="112" cy="-34" r="7"/><circle cx="44" cy="74" r="7"/>
        <circle cx="-94" cy="58" r="7"/>
      </g>
      <circle r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
      <circle r="5" fill="#6d28d9" class="beat"/>
    </g>

    <g class="in d1">
      <text class="sans" x="64" y="168" font-size="80" font-weight="800" letter-spacing="-0.028em"
            fill="url(#nameGrad)" filter="url(#bloom)" opacity="0.4">Poras Nagar</text>
      <text class="sans" x="64" y="168" font-size="80" font-weight="800" letter-spacing="-0.028em"
            fill="url(#nameGrad)">Poras Nagar</text>
    </g>

    <g clip-path="url(#typeClip)">
      <text class="mono" x="64" y="230" font-size="21" fill="#4a5565" letter-spacing="0.01em">
        <tspan fill="#9aa5b4">&gt;&#160;</tspan>AI Engineer · Distributed Systems · Full-Stack
      </text>
    </g>
    <rect x="676" y="209" width="10" height="25" fill="#0891b2" class="caret">
      <animate attributeName="x" values="64;64;676" keyTimes="0;0.16;0.92" dur="4.4s" fill="freeze"/>
    </rect>

    <g class="in d4">
      <g>
        <rect x="64" y="268" width="176" height="30" rx="7" fill="#ffffff" stroke="#dde3ea"/>
        <circle cx="82" cy="283" r="3.6" fill="#1a7f37" class="beat"/>
        <text class="mono" x="94" y="287" font-size="12" fill="#4a5565" letter-spacing="0.05em">building @ EnxtAI</text>
      </g>
      <g>
        <rect x="252" y="268" width="178" height="30" rx="7" fill="#ffffff" stroke="#dde3ea"/>
        <text x="268" y="287" font-size="12" class="mono" fill="#4a5565" letter-spacing="0.05em">Noida, IN · UTC+5:30</text>
      </g>
      <g>
        <rect x="442" y="268" width="196" height="30" rx="7" fill="#ffffff" stroke="#dde3ea"/>
        <text x="458" y="287" font-size="12" class="mono" fill="#4a5565" letter-spacing="0.05em">B.Tech CSE · AI &amp; ML</text>
      </g>
    </g>

    <rect x="0" y="336" width="1200" height="3" fill="url(#rule)"/>
  </g>
</svg>
