<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="stoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#06070b" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="stoxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.2)" />
    </linearGradient>
  </defs>

  <style>
    .h-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; }
    .price { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; fill: #ffffff; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #34d399; }
    .meta-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #64748b; }
    .meta-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #e2e8f0; }
  </style>

  <!-- Card Body -->
  <rect x="1" y="1" width="878" height="208" rx="16" fill="url(#stoxBg)" stroke="url(#stoxBorder)" stroke-width="1.2" />

  <!-- Left: Info -->
  <g transform="translate(28, 24)">
    <rect width="130" height="22" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#34d399" />
    <text x="20" y="15" class="badge">LIVE IN PRODUCTION</text>

    <text x="0" y="52" class="h-text">UnlistedStox.com — AI Equity Engine</text>
    <text x="0" y="74" class="sub-text">AI-powered pricing &amp; valuation engine for pre-IPO unlisted shares. Features automated cap-table analytics,</text>
    <text x="0" y="92" class="sub-text">dealer bid/ask spread ingestion, and predictive valuation confidence models built on TensorFlow.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="60" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="30" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Python</text>

      <rect x="68" y="0" width="85" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="110" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">TensorFlow</text>

      <rect x="161" y="0" width="55" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="188" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">React</text>

      <rect x="224" y="0" width="65" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="256" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Node.js</text>

      <rect x="297" y="0" width="85" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="339" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">PostgreSQL</text>
    </g>
  </g>

  <!-- Right: Sparkline Widget Box -->
  <g transform="translate(540, 20)">
    <rect width="310" height="170" rx="12" fill="#090b14" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Price Header -->
    <text x="18" y="28" class="meta-label">PRE-IPO INDEX BENCHMARK</text>
    <text x="18" y="52" class="price">₹1,420.50</text>
    <rect x="145" y="34" width="60" height="20" rx="4" fill="rgba(52, 211, 153, 0.15)" />
    <text x="175" y="48" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">+20.34%</text>

    <!-- Sparkline Line -->
    <path d="M 18 115 L 60 110 L 100 118 L 140 98 L 180 102 L 230 82 L 292 70" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 18 115 L 60 110 L 100 118 L 140 98 L 180 102 L 230 82 L 292 70 L 292 135 L 18 135 Z" fill="url(#chartGrad)" />

    <!-- Metric Footers -->
    <line x1="18" y1="135" x2="292" y2="135" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="18" y="152" class="meta-label">MODEL CONFIDENCE</text>
    <text x="18" y="164" class="meta-val" fill="#34d399">94.8% (TensorFlow)</text>

    <text x="180" y="152" class="meta-label">DAILY VOLUME</text>
    <text x="180" y="164" class="meta-val">₹4.82 Cr / day</text>
  </g>
</svg>
