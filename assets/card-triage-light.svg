<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 176" width="580" height="176" role="img" aria-label="TRIAGE_GATEWAY">
  <defs>
    <linearGradient id="tb_TRI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000080"/><stop offset="100%" stop-color="#1084d0"/>
    </linearGradient>
    <clipPath id="cp_TRI"><rect width="580" height="176" rx="2"/></clipPath>
  </defs>
  <style>
    .w98 { font-family: "MS Sans Serif", Tahoma, -apple-system, sans-serif; font-size: 11px; }
    .mono { font-family: ui-monospace, "Courier New", monospace; font-size: 11px; }
  </style>
  <g clip-path="url(#cp_TRI)">
