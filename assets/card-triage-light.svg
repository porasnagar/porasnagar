<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170" width="580" height="170" role="img" aria-label="WhatsApp Triage Console">
  <defs>
    <clipPath id="c2"><rect width="580" height="170" rx="10"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .beat { animation: b 2.2s infinite ease-in-out; }
    @keyframes b { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <g clip-path="url(#c2)">
    <rect width="580" height="170" fill="#ffffff"/>
    <rect width="580" height="36" fill="#eaeff5"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#e3e8ef" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#28c840"/>
    <text class="mono" x="66" y="22" font-size="11" fill="#64748b">service: whatsapp_triage_dispatcher.js</text>
    <circle cx="504" cy="18" r="3.5" fill="#16a34a" class="beat"/>
    <text class="mono" text-anchor="end" x="562" y="22" font-size="10.5" fill="#16a34a">TIER-2 ACTIVE</text>

    <!-- Webhook latency & Auth -->
    <g transform="translate(18, 48)">
      <rect width="260" height="106" rx="6" fill="#f8fafc" stroke="#e3e8ef" stroke-width="1"/>
      <text class="mono" x="12" y="20" font-size="10" fill="#64748b">WEBHOOK ACK LATENCY</text>
      <text class="mono" x="12" y="52" font-size="24" font-weight="700" fill="#25D366">142 <tspan font-size="14" fill="#64748b">ms</tspan></text>
      <text class="mono" x="12" y="74" font-size="10.5" fill="#64748b">Target window: &lt; 200 ms</text>
      <text class="mono" x="12" y="94" font-size="10" fill="#25D366">HMAC-SHA256 verified</text>
    </g>

    <g transform="translate(294, 48)">
      <rect width="268" height="106" rx="6" fill="#f8fafc" stroke="#e3e8ef" stroke-width="1"/>
      <text class="mono" x="14" y="20" font-size="10" fill="#64748b">MULTI-TURN TRIAGE SESSION</text>
      <rect x="14" y="32" width="180" height="18" rx="4" fill="#25D366" opacity="0.2"/>
      <text class="mono" x="22" y="45" font-size="9.5" fill="#25D366">Patient Intake Confirmed</text>
      <rect x="14" y="56" width="220" height="18" rx="4" fill="#e3e8ef"/>
      <text class="mono" x="22" y="69" font-size="9.5" fill="#64748b">Expiring Signed Report Link</text>
      <text class="mono" x="14" y="94" font-size="10" fill="#16a34a">● MongoDB Session Locked</text>
    </g>
    <rect width="580" height="170" rx="10" fill="none" stroke="#e3e8ef" stroke-width="1"/>
  </g>
</svg>