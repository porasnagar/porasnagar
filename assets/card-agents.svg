<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170" width="580" height="170" role="img" aria-label="Hermes Agentic CI Console">
  <defs>
    <clipPath id="c4"><rect width="580" height="170" rx="10"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .beat { animation: b 2.2s infinite ease-in-out; }
    @keyframes b { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <g clip-path="url(#c4)">
    <rect width="580" height="170" fill="#0b0f17"/>
    <rect width="580" height="36" fill="#090d14"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#1b2230" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#28c840"/>
    <text class="mono" x="66" y="22" font-size="11" fill="#8b98ab">agent: hermes_document_pipeline.py</text>
    <circle cx="504" cy="18" r="3.5" fill="#28c840" class="beat"/>
    <text class="mono" text-anchor="end" x="562" y="22" font-size="10.5" fill="#28c840">CI RUNNING</text>

    <!-- Multi-Agent Artifact Pipeline -->
    <g transform="translate(18, 48)">
      <rect width="260" height="106" rx="6" fill="#0e1422" stroke="#1b2230" stroke-width="1"/>
      <text class="mono" x="12" y="20" font-size="10" fill="#8b98ab">AUTONOMOUS DOC SYNTHESIS</text>
      <text class="mono" x="12" y="44" font-size="11.5" fill="#e6edf3">Templates in → DOCX/PPTX/XLSX</text>
      <text class="mono" x="12" y="66" font-size="11.5" fill="#8b98ab">Versioned directly in CI commits</text>
      <text class="mono" x="12" y="94" font-size="10" fill="#f59e0b">Tool-calling shared across 4 repos</text>
    </g>

    <g transform="translate(294, 48)">
      <rect width="268" height="106" rx="6" fill="#0e1422" stroke="#1b2230" stroke-width="1"/>
      <text class="mono" x="14" y="20" font-size="10" fill="#8b98ab">INTERNAL WORKFLOW DISPATCH</text>
      <rect x="14" y="32" width="220" height="18" rx="4" fill="#f59e0b" opacity="0.2"/>
      <text class="mono" x="22" y="45" font-size="9.5" fill="#f59e0b">Multi-Agent Planner: Resolved</text>
      <rect x="14" y="56" width="190" height="18" rx="4" fill="#1b2230"/>
      <text class="mono" x="22" y="69" font-size="9.5" fill="#8b98ab">Artifact: Deck &amp; Sheet Compiled</text>
      <text class="mono" x="14" y="94" font-size="10" fill="#28c840">● Fast Execution in GitHub Actions</text>
    </g>
    <rect width="580" height="170" rx="10" fill="none" stroke="#1b2230" stroke-width="1"/>
  </g>
</svg>