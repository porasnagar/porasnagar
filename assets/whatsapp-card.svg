<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091210" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>

    <linearGradient id="waBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.2)" />
    </linearGradient>
  </defs>

  <style>
    .h-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; }
    .chat-user { font-family: -apple-system, sans-serif; font-size: 11px; fill: #ffffff; }
    .chat-bot { font-family: -apple-system, sans-serif; font-size: 11px; fill: #d1fae5; }
    .wa-time { font-family: monospace; font-size: 9px; fill: #6ee7b7; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #34d399; }
  </style>

  <!-- Card Body -->
  <rect x="1" y="1" width="878" height="208" rx="16" fill="url(#waBg)" stroke="url(#waBorder)" stroke-width="1.2" />

  <!-- Left: Content Description -->
  <g transform="translate(28, 24)">
    <rect width="170" height="22" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#34d399" />
    <text x="20" y="15" class="badge">WHATSAPP CLOUD API</text>

    <text x="0" y="52" class="h-text">Hospital Management &amp; WhatsApp AI</text>
    <text x="0" y="74" class="sub-text">Autonomous healthcare triage and patient coordination bot connected via Meta WhatsApp Business API.</text>
    <text x="0" y="92" class="sub-text">Handles automated doctor appointment booking, real-time prescription courier dispatch, and encrypted lab reports.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="140" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="70" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Meta WhatsApp API</text>

      <rect x="148" y="0" width="65" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="180" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Node.js</text>

      <rect x="221" y="0" width="70" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="256" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">MongoDB</text>

      <rect x="299" y="0" width="70" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="334" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Webhooks</text>

      <rect x="377" y="0" width="55" height="22" rx="5" fill="rgba(255,255,255,0.05)" />
      <text x="404" y="15" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">React</text>
    </g>
  </g>

  <!-- Right: Simulated Chat Bubble View -->
  <g transform="translate(540, 18)">
    <rect width="310" height="174" rx="12" fill="#040907" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />

    <!-- Chat Header -->
    <rect x="1" y="1" width="308" height="32" rx="11" fill="#0b1713" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="30" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Apollo Health AI Assistant</text>
    <text x="255" y="21" font-family="monospace" font-size="9" fill="#34d399">VERIFIED ✓</text>

    <!-- User bubble -->
    <g transform="translate(90, 44)">
      <rect width="205" height="26" rx="8" fill="#065f46" />
      <text x="10" y="17" class="chat-user">📅 Book appointment with Cardiology</text>
      <text x="185" y="20" class="wa-time">10:14</text>
    </g>

    <!-- Bot bubble -->
    <g transform="translate(15, 78)">
      <rect width="280" height="52" rx="8" fill="#132a22" stroke="rgba(16,185,129,0.2)" stroke-width="1" />
      <text x="10" y="18" class="chat-bot">✅ Slot confirmed with Dr. Sharma (Cardiology)</text>
      <text x="10" y="34" class="chat-bot">📅 Tomorrow at 10:30 AM · Token #A-42</text>
      <text x="245" y="44" class="wa-time">10:14 ✓✓</text>
    </g>

    <!-- Refill Prompt -->
    <g transform="translate(15, 138)">
      <rect width="135" height="22" rx="6" fill="#064e3b" />
      <text x="12" y="15" font-family="monospace" font-size="10" fill="#a7f3d0">💊 Prescription Refilled</text>
      <rect x="160" y="0" width="135" height="22" rx="6" fill="#064e3b" />
      <text x="172" y="15" font-family="monospace" font-size="10" fill="#a7f3d0">🧪 Lab Report Ready</text>
    </g>
  </g>
</svg>
