<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170" width="580" height="170" role="img" aria-label="Scraper &amp; Queue Console">
  <defs>
    <clipPath id="c3"><rect width="580" height="170" rx="10"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .beat { animation: b 2.2s infinite ease-in-out; }
    @keyframes b { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <g clip-path="url(#c3)">
    <rect width="580" height="170" fill="#0b0f17"/>
    <rect width="580" height="36" fill="#090d14"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#1b2230" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#28c840"/>
    <text class="mono" x="66" y="22" font-size="11" fill="#8b98ab">broker: rabbitmq_redis_pipeline.py</text>
    <circle cx="504" cy="18" r="3.5" fill="#28c840" class="beat"/>
    <text class="mono" text-anchor="end" x="562" y="22" font-size="10.5" fill="#28c840">FAN-OUT OK</text>

    <!-- Throughput & Dead-letter -->
    <g transform="translate(18, 48)">
      <rect width="260" height="106" rx="6" fill="#0e1422" stroke="#1b2230" stroke-width="1"/>
      <text class="mono" x="12" y="20" font-size="10" fill="#8b98ab">INGESTION CLUSTER RATE</text>
      <text class="mono" x="12" y="52" font-size="24" font-weight="700" fill="#7c5cff">10,480 <tspan font-size="14" fill="#8b98ab">pg/min</tspan></text>
      <text class="mono" x="12" y="74" font-size="10.5" fill="#8b98ab">Back-pressured rate budget</text>
      <text class="mono" x="12" y="94" font-size="10" fill="#7c5cff">Schema boundary validated</text>
    </g>

    <g transform="translate(294, 48)">
      <rect width="268" height="106" rx="6" fill="#0e1422" stroke="#1b2230" stroke-width="1"/>
      <text class="mono" x="14" y="20" font-size="10" fill="#8b98ab">QUEUE RESILIENCE &amp; REPLAY</text>
      <text class="mono" x="14" y="44" font-size="12" fill="#e6edf3">RabbitMQ Ack Rate: <tspan fill="#28c840">99.98%</tspan></text>
      <text class="mono" x="14" y="66" font-size="12" fill="#e6edf3">Redis Dead-Letter Replay: <tspan fill="#7c5cff">Ready</tspan></text>
      <text class="mono" x="14" y="94" font-size="10" fill="#28c840">● 0 dropped filing records</text>
    </g>
    <rect width="580" height="170" rx="10" fill="none" stroke="#1b2230" stroke-width="1"/>
  </g>
</svg>