          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">TypeScript</text>
        </g>
        <g transform="translate(128, 0)">
          <rect width="118" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">React 18</text>
        </g>
        <g transform="translate(0, 42)">
          <rect width="118" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Next.js</text>
        </g>
        <g transform="translate(128, 42)">
          <rect width="118" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">TailwindCSS</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="118" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Docker</text>
        </g>
        <g transform="translate(128, 84)">
          <rect width="118" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">GitHub Actions</text>
        </g>
        <g transform="translate(0, 126)">
