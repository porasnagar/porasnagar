      <rect x="0" y="0" width="276" height="36" rx="10" fill="#131a29"/>
      <rect x="0" y="26" width="276" height="10" fill="#131a29"/>
      <text class="mono" x="16" y="23" font-size="11" fill="#28c840" font-weight="700" letter-spacing="0.08em">FRONTEND &amp; PLATFORMS</text>

