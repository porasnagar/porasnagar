          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Time-Series</text>
        </g>
        <g transform="translate(0, 126)">
          <rect width="234" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#8b98ab">Dead-Letter Queue Replay</text>
