          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">PyTorch</text>
        </g>
        <g transform="translate(0, 42)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">scikit-learn</text>
        </g>
        <g transform="translate(122, 42)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">OpenCV</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Pandas / NumPy</text>
        </g>
        <g transform="translate(122, 84)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Regression</text>
        </g>
        <g transform="translate(0, 126)">
