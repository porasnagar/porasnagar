<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Poras Nagar — Production Tech Stack">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="0.15" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="0.85" cy="0.65" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2230" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .beat { animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .chip { transition: transform .2s; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#canvas)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#bloomA)"/>
    <rect width="1200" height="340" fill="url(#bloomB)"/>

    <!-- Header Chrome -->
    <rect width="1200" height="48" fill="#090d14" opacity="0.78"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#1b2230" stroke-width="1"/>
    <circle cx="32" cy="24" r="5" fill="#ff5f57"/>
    <circle cx="50" cy="24" r="5" fill="#febc2e"/>
    <circle cx="68" cy="24" r="5" fill="#28c840"/>
    <text class="mono" x="92" y="29" font-size="12.5" fill="#5b6675" letter-spacing="0.05em">porasnagar / config / production_stack.yaml</text>
    <circle cx="1040" cy="24" r="4" fill="#22d3ee" class="beat"/>
    <text class="mono" text-anchor="end" x="1168" y="29" font-size="12" fill="#6b7788" letter-spacing="0.05em">18 production services active</text>

    <!-- 4 Category Columns -->
    <!-- Column 1: Backend & Distributed -->
    <g transform="translate(36, 72)">
      <rect width="268" height="240" rx="10" fill="#0b1019" stroke="#1b2230" stroke-width="1"/>
      <rect x="0" y="0" width="268" height="36" rx="10" fill="#131a29"/>
      <rect x="0" y="26" width="268" height="10" fill="#131a29"/>
      <text class="mono" x="16" y="23" font-size="11" fill="#22d3ee" font-weight="700" letter-spacing="0.08em">SYSTEMS &amp; BACKEND</text>
      
      <!-- Chips -->
      <g transform="translate(14, 48)">
        <g transform="translate(0, 0)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Python 3.12</text>
        </g>
        <g transform="translate(122, 0)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">FastAPI</text>
        </g>
        <g transform="translate(0, 42)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Node.js</text>
        </g>
        <g transform="translate(122, 42)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">Express</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#e6edf3">RabbitMQ</text>
        </g>
        <g transform="translate(122, 84)">
          <rect width="112" height="30" rx="6" fill="#0e1422" stroke="#1f2a3c" stroke-width="1"/>
