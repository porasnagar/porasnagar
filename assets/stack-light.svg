          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">React 18</text>
        </g>
        <g transform="translate(0, 42)">
          <rect width="118" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Next.js</text>
        </g>
        <g transform="translate(128, 42)">
          <rect width="118" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">TailwindCSS</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="118" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Docker</text>
        </g>
        <g transform="translate(128, 84)">
          <rect width="118" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">GitHub Actions</text>
        </g>
