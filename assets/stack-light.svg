<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Poras Nagar — Production Tech Stack">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="0.15" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="0.85" cy="0.65" r="0.55">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e8ef" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .beat { animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#canvas)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#bloomA)"/>
    <rect width="1200" height="340" fill="url(#bloomB)"/>

    <!-- Header Chrome -->
    <rect width="1200" height="48" fill="#eaeff5" opacity="0.85"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#e3e8ef" stroke-width="1"/>
    <circle cx="32" cy="24" r="5" fill="#dc2626"/>
    <circle cx="50" cy="24" r="5" fill="#d97706"/>
    <circle cx="68" cy="24" r="5" fill="#16a34a"/>
    <text class="mono" x="92" y="29" font-size="12.5" fill="#64748b" letter-spacing="0.05em">porasnagar / config / production_stack.yaml</text>
    <circle cx="1040" cy="24" r="4" fill="#0891b2" class="beat"/>
    <text class="mono" text-anchor="end" x="1168" y="29" font-size="12" fill="#64748b" letter-spacing="0.05em">18 production services active</text>

