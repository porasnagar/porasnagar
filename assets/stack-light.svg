      <rect x="0" y="0" width="268" height="36" rx="10" fill="#edf2f7"/>
      <rect x="0" y="26" width="268" height="10" fill="#edf2f7"/>
      <text class="mono" x="16" y="23" font-size="11" fill="#0891b2" font-weight="700" letter-spacing="0.08em">SYSTEMS &amp; BACKEND</text>
      
      <g transform="translate(14, 48)">
        <g transform="translate(0, 0)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1" stroke-opacity="0.4"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Python 3.12</text>
        </g>
        <g transform="translate(122, 0)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">FastAPI</text>
        </g>
        <g transform="translate(0, 42)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Node.js</text>
        </g>
        <g transform="translate(122, 42)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Express</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">RabbitMQ</text>
