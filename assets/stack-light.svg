        </g>
        <g transform="translate(0, 42)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">scikit-learn</text>
        </g>
        <g transform="translate(122, 42)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">OpenCV</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="112" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text class="mono" x="12" y="19" font-size="11" fill="#1f2937">Pandas / NumPy</text>
        </g>
        <g transform="translate(122, 84)">
