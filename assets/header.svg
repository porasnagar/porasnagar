<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="100%" height="130" fill="none">
  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.03em; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #8b949e; letter-spacing: -0.01em; }
    .meta { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-variant-numeric: tabular-nums; fill: #8b949e; }
    .status { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #3fb950; }
  </style>

  <!-- Frame: Matches GitHub Native Dark Mode -->
  <rect x="0.5" y="0.5" width="859" height="129" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Top row: Status & Location -->
  <g transform="translate(24, 24)">
    <circle cx="4" cy="4" r="3.5" fill="#238636" />
    <text x="14" y="7" class="status">Active · Shipping at EnxtAI</text>
    <text x="210" y="7" class="meta">Noida, India (UTC+5:30)</text>
    <text x="700" y="7" class="meta" text-anchor="end">github.com/porasnagar</text>
  </g>

  <!-- Middle row: Name & Specialty -->
  <g transform="translate(24, 62)">
    <text x="0" y="0" class="name">Poras Nagar</text>
    <text x="162" y="-3" class="role">/ AI Engineer &amp; Distributed Systems</text>
  </g>

  <!-- Bottom row: Key Focus Areas -->
  <g transform="translate(24, 98)">
    <text x="0" y="0" class="meta" fill="#c9d1d9">Focus:</text>
    <text x="44" y="0" class="meta">Python · Scrapy · Redis Queue · RabbitMQ Broker · Meta WhatsApp API · PostgreSQL · React</text>
  </g>
</svg>
