<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- One file, works on both GitHub themes. Reuse it between every section. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="0.5"  stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.82" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .run { animation: run 6s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes run { 0% { transform: translateX(-260px) } 70%,100% { transform: translateX(1260px) } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0 } }
  </style>
  <rect y="5" width="1200" height="1.5" fill="url(#base)"/>
  <g class="run"><rect y="4.25" width="240" height="3" rx="1.5" fill="url(#spark)"/></g>
</svg>
